<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>EcoValora | Catálogo de Materiales</title>

        <link rel="stylesheet" href="style/bootstrap/css/bootstrap.min.css">
        <link rel="stylesheet" href="style/bootstrap/css/bootstrap-utilities.min.css">
    </head>
    <body style="background-color:#F5F5F5;">

        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#2E7D32;">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">♻ EcoValora</a>

                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active" href="catalogo.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="guia.html">Guía Educativa</a></li>
                        <li class="nav-item"><a class="nav-link" href="centrosReciclaje.html">Centros</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- TÍTULO -->
        <section class="py-4 text-center">
            <div class="container">
                <h2 class="fw-bold text-success">Catálogo de Materiales Valorizables</h2>
                <p class="text-secondary">Selecciona un material para conocer su proceso de reciclaje.</p>
            </div>
        </section>

        <!-- TARJETAS -->
        <section class="container mb-5">
            <div class="row row-cols-1 row-cols-md-3 g-4" id="contenedor-catalogo">
                <!-- Aquí se insertarán las tarjetas desde el backend -->
            </div>
        </section>

        <footer class="text-center py-3" style="background-color:#2E7D32; color:white;">
            <small>© 2026 EcoValora | Código para el mañana</small>
        </footer>

        <script src="js/bootstrap.bundle.min.js"></script>

        <!-- Script api -->
        <script>
            fetch('/EcoValora/api/catalogo')
                    .then(response => response.json())
                    .then(data => {
                        const contenedor = document.getElementById("catalogo");
                        data.forEach(material => {
                            const card = `
                <div class="col-md-4">
                  <div class="card h-100 text-center shadow-sm">
                    <div class="card-body">
                      <h5>${material.nombre}</h5>
                      <p>${material.descripcion}</p>
                      <a href="#" class="btn btn-outline-success">Ver más</a>
                    </div>
                  </div>
                </div>`;
                            contenedor.innerHTML += card;
                        });
                    })
                    .catch(error => console.error("Error cargando catálogo:", error));
        </script>
        <script>
    document.addEventListener("DOMContentLoaded", () => {
        const contenedor = document.getElementById('contenedor-catalogo');
        
        // Cargamos los materiales desde la carpeta que creaste
        fetch('assets/json/materiales_valorizables.json')
            .then(response => response.json())
            .then(data => {
                data.forEach(material => {
                    const card = `
                        <div class="col">
                            <div class="card h-100 shadow-sm">
                                <img src="${material.imagen_url}" class="card-img-top" alt="${material.nombre}" style="height: 200px; object-fit: cover;">
                                <div class="card-body text-center">
                                    <h5 class="card-title text-success">${material.nombre}</h5>
                                    <p class="card-text text-muted">${material.descripcion_corta}</p>
                                    <a href="detalle.html?id=${material.id}" class="btn btn-success">Ver Detalles</a>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += card;
                });
            })
            .catch(error => console.error("Error cargando catálogo:", error));
    });
</script>

    </body>
</html>
